[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PcrTimelineTester"
version = "1.1.0"
description = "PcrTimelineTester：基于 PCRCalculator /simulate 接口的独立调轴工具（逐帧搜索 + 语义 GA）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = ["httpx>=0.27,<0.29", "openpyxl>=3.1.5,<3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6", "pillow>=10,<12"]
icons = ["pillow>=10,<12"]

[project.scripts]
PcrTimelineTester = "PcrTimelineTester.cli:main"
PcrTimelineTester-gui = "PcrTimelineTester.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
PcrTimelineTester = ["app-icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]


