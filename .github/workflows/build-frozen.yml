name: build-frozen

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Windows runner 默认 cp1252，脚本里的中文一 print 就会 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyinstaller pillow

      - name: 跑测试
        run: python -m pytest -q

      - name: 构建冻结版
        run: python tools/build_frozen.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PcrTimelineTester-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: 发布（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
